<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04122e">
<meta name="color-scheme" content="dark">
<title>BIMTEK Digitalisasi Pembelajaran — SD Negeri 1 Godegan</title>

<style>
/* ============================================================
   DESIGN TOKENS · BLUE THEME
   ============================================================ */
:root {
  --blue-950: #04122e;
  --blue-900: #071a3d;
  --blue-800: #0a2455;
  --blue-700: #0e3075;
  --blue-600: #1544a1;
  --blue-500: #1e5fd4;
  --blue-400: #3b82f6;
  --blue-300: #60a5fa;
  --blue-200: #93c5fd;

  --white:    #ffffff;
  --white-95: rgba(255, 255, 255, 0.95);

  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;

  --r-md: 12px;
  --r-lg: 20px;
  --r-full: 999px;

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 480ms;

  --header-h: clamp(52px, 6vh, 76px);
  --nav-size: clamp(48px, 5.6vh, 76px);
  --pad-x: clamp(20px, 2.4vw, 48px);
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  background: var(--blue-950);
  color: var(--white);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  overscroll-behavior: none;
}

button {
  font-family: inherit;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: var(--s-5);
  padding: 0 var(--pad-x);
  background: linear-gradient(180deg, var(--blue-900) 0%, var(--blue-950) 100%);
  border-bottom: 1px solid rgba(59, 130, 246, 0.18);
  flex-shrink: 0;
  z-index: 10;
  position: relative;
}

.header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(59, 130, 246, 0.65) 50%,
    transparent 100%
  );
  pointer-events: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  flex-shrink: 0;
  height: 100%;
}

.brand__logo {
  height: calc(var(--header-h) * 0.64);
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 2px 6px rgba(30, 95, 212, 0.4));
}

.brand__name {
  font-size: clamp(12px, 1.05vw, 17px);
  font-weight: 600;
  color: var(--white-95);
  letter-spacing: 0.005em;
  white-space: nowrap;
}

.header__title {
  flex: 1;
  text-align: right;
  font-size: clamp(11px, 0.95vw, 16px);
  font-weight: 700;
  color: var(--blue-200);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.icon-btn {
  flex-shrink: 0;
  width: calc(var(--header-h) * 0.58);
  height: calc(var(--header-h) * 0.58);
  border-radius: var(--r-md);
  display: grid;
  place-items: center;
  color: var(--blue-200);
  background: transparent;
  transition: background 180ms var(--ease), color 180ms var(--ease), transform 120ms var(--ease);
  touch-action: manipulation;
}

.icon-btn svg { width: 46%; height: 46%; }

.icon-btn:hover {
  background: rgba(59, 130, 246, 0.15);
  color: var(--white);
}

.icon-btn:active {
  background: rgba(59, 130, 246, 0.25);
  transform: scale(0.94);
}

/* ============================================================
   MAIN / STAGE
   ============================================================ */
.main {
  flex: 1;
  padding: var(--s-3) var(--s-3) var(--s-4);
  display: flex;
  min-height: 0;
  background: var(--blue-950);
  position: relative;
}

.main::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  height: 80%;
  background: radial-gradient(
    ellipse at center,
    rgba(30, 95, 212, 0.18) 0%,
    transparent 70%
  );
  pointer-events: none;
  z-index: 0;
}

.stage {
  position: relative;
  flex: 1;
  background: #000;
  border-radius: 0;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(59, 130, 246, 0.15),
    0 0 0 4px rgba(30, 95, 212, 0.08),
    0 24px 64px rgba(0, 0, 0, 0.7);
  isolation: isolate;
  z-index: 1;
  cursor: none;
}

.stage.show-ui { cursor: default; }

.stage::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    transparent 55%,
    rgba(0, 0, 0, 0.4) 100%
  );
  pointer-events: none;
  z-index: 2;
  opacity: 0.55;
}

/* ============================================================
   SLIDE
   ============================================================ */
.slide {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transform: scale(0.985);
  transition:
    opacity var(--dur) var(--ease),
    transform var(--dur) var(--ease),
    visibility 0s linear var(--dur);
  will-change: opacity, transform;
  z-index: 1;
}

.slide.is-active {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
  transition:
    opacity var(--dur) var(--ease),
    transform var(--dur) var(--ease),
    visibility 0s;
}

.slide img,
.slide video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  background: #000;
  cursor: default;
}

.slide--cover img,
.slide--cover video {
  object-fit: cover;
}

/* ============================================================
   NAV BUTTONS · auto-hide + fix disabled
   ============================================================ */
.nav-btn {
  position: absolute;
  top: 50%;
  width: var(--nav-size);
  height: var(--nav-size);
  border-radius: var(--r-full);
  display: grid;
  place-items: center;
  background: rgba(10, 36, 85, 0.6);
  color: var(--white-95);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  border: 1px solid rgba(59, 130, 246, 0.3);
  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
  z-index: 20;
  cursor: pointer;

  /* Hidden default */
  opacity: 0;
  pointer-events: none;
  transform: translateY(-50%) scale(0.9);

  transition:
    opacity 260ms var(--ease),
    transform 260ms var(--ease-out),
    background 200ms var(--ease),
    box-shadow 220ms var(--ease),
    border-color 200ms var(--ease);
}

.nav-btn svg {
  width: 42%;
  height: 42%;
}

.nav-btn--prev { left: clamp(12px, 1.6vw, 28px); }
.nav-btn--next { right: clamp(12px, 1.6vw, 28px); }

/* Visible saat .stage.show-ui */
.stage.show-ui .nav-btn {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(-50%) scale(1);
}

.nav-btn:hover:not(:disabled) {
  background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
  border-color: rgba(147, 197, 253, 0.5);
  box-shadow:
    0 12px 36px rgba(30, 95, 212, 0.55),
    0 0 0 1px rgba(147, 197, 253, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
  transform: translateY(-50%) scale(1.08);
}

.nav-btn:active:not(:disabled) {
  transform: translateY(-50%) scale(0.94);
  transition-duration: 100ms;
}

/* Disabled = benar-benar tidak terlihat */
.nav-btn:disabled {
  opacity: 0 !important;
  pointer-events: none;
  visibility: hidden;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 720px) {
  .header__title { display: none; }
  .brand__name { font-size: 12px; }
  :root {
    --pad-x: 16px;
    --s-5: 16px;
  }
}

@media (max-width: 480px) {
  .brand__name { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="header">
    <div class="brand">
      <img class="brand__logo" src="assets/logo-sd.png" alt="Logo SD Negeri 1 Godegan">
      <span class="brand__name">SD Negeri 1 Godegan</span>
    </div>

    <h1 class="header__title">BIMTEK Digitalisasi Pembelajaran</h1>

    <button class="icon-btn" id="btn-fullscreen" aria-label="Layar penuh" title="Layar penuh (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  </header>

  <!-- ================= SLIDE STAGE ================= -->
  <main class="main">
    <div class="stage" id="stage">

      <!-- Slide 1 · Gambar -->
      <div class="slide is-active">
        <img src="assets/img/slide-1.jpg" alt="Slide 1">
      </div>

      <!-- Slide 2 · Video Indonesia Raya -->
      <div class="slide">
        <video src="assets/video/indonesia-raya.mp4"
               controls playsinline preload="metadata">
          Browser tidak mendukung pemutar video.
        </video>
      </div>

      <!-- Slide 3 · Gambar -->
      <div class="slide">
        <img src="assets/img/slide-3.jpg" alt="Slide 3">
      </div>

      <!-- Slide 4 · Video Bagimu Negeri -->
      <div class="slide">
        <video src="assets/video/bagimu-negeri.mp4"
               controls playsinline preload="metadata">
          Browser tidak mendukung pemutar video.
        </video>
      </div>

      <!-- Slide 5 · Gambar -->
      <div class="slide">
        <img src="assets/img/slide-5.jpg" alt="Slide 5">
      </div>

      <!-- Tombol navigasi overlay (auto-hide) -->
      <button class="nav-btn nav-btn--prev" id="btn-prev" aria-label="Slide sebelumnya">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <button class="nav-btn nav-btn--next" id="btn-next" aria-label="Slide berikutnya">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>

    </div>
  </main>

  <!-- ================= SCRIPT ================= -->
  <script>
  (() => {
    'use strict';

    const $ = (sel) => document.querySelector(sel);

    const stage   = $('#stage');
    const fsBtn   = $('#btn-fullscreen');
    const prevBtn = $('#btn-prev');
    const nextBtn = $('#btn-next');
    const slides  = Array.from(document.querySelectorAll('.slide'));
    const total   = slides.length;

    let current = 0;

    /* ============================================================
       AUTO-HIDE UI
       ============================================================ */
    const HIDE_DELAY = 2000;
    let hideTimer = null;

    function clearHideTimer() {
      if (hideTimer) {
        clearTimeout(hideTimer);
        hideTimer = null;
      }
    }

    function scheduleHide(delay = HIDE_DELAY) {
      clearHideTimer();
      hideTimer = setTimeout(() => {
        stage.classList.remove('show-ui');
      }, delay);
    }

    function showUI(delay = HIDE_DELAY) {
      stage.classList.add('show-ui');
      scheduleHide(delay);
    }

    /* ============================================================
       VIDEO LIFECYCLE
       ============================================================ */
    function pauseVideo(slide) {
      const v = slide?.querySelector('video');
      if (v && !v.paused) v.pause();
    }

    function playVideo(slide) {
      const v = slide?.querySelector('video');
      if (!v) return;

      try { v.currentTime = 0; } catch (_) {}

      const p = v.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }

    /* ============================================================
       NAVIGATION
       ============================================================ */
    function syncButtons() {
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === total - 1;
    }

    function goTo(index) {
      if (index < 0 || index >= total || index === current) return;

      pauseVideo(slides[current]);

      slides[current].classList.remove('is-active');
      current = index;
      slides[current].classList.add('is-active');

      playVideo(slides[current]);
      syncButtons();
    }

    const prev = () => goTo(current - 1);
    const next = () => goTo(current + 1);

    /* ============================================================
       FULLSCREEN
       ============================================================ */
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.();
      }
    }

    /* ============================================================
       EVENTS
       ============================================================ */

    // Mousemove — throttle
    let lastMove = 0;
    stage.addEventListener('mousemove', () => {
      const now = performance.now();
      if (now - lastMove < 80) return;
      lastMove = now;
      showUI();
    }, { passive: true });

    // Touch
    stage.addEventListener('touchstart', () => {
      showUI(2500);
    }, { passive: true });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === 'VIDEO' || tag === 'INPUT' || tag === 'TEXTAREA') return;

      switch (e.key) {
        case 'ArrowLeft':  prev(); showUI(1500); break;
        case 'ArrowRight': next(); showUI(1500); break;
        case 'f':
        case 'F':          toggleFullscreen(); break;
      }
    });

    // Tombol prev/next — pause hide saat hover
    [prevBtn, nextBtn].forEach((btn) => {
      btn.addEventListener('mouseenter', clearHideTimer);
      btn.addEventListener('mouseleave', () => scheduleHide(1200));
      btn.addEventListener('click', () => {
        btn === prevBtn ? prev() : next();
        scheduleHide(1500);
      });
    });

    // Swipe
    let startX = 0, startY = 0;
    stage.addEventListener('touchstart', (e) => {
      const t = e.changedTouches[0];
      startX = t.screenX;
      startY = t.screenY;
    }, { passive: true });

    stage.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - startX;
      const dy = e.changedTouches[0].screenY - startY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
        dx > 0 ? prev() : next();
        showUI(1500);
      }
    }, { passive: true });

    fsBtn.addEventListener('click', toggleFullscreen);

    /* ============================================================
       INIT
       ============================================================ */
    function init() {
      syncButtons();
      playVideo(slides[current]);
      // Tidak auto-show — biar bersih saat load pertama.
      // UI muncul hanya saat mouse bergerak / touch / keyboard.
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>

</body>
</html>
